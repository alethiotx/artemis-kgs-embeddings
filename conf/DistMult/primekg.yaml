# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Adapted from Table 5 DistMult on BioKG (PrimeKG not in the study)

model:
  name: DistMult
  embedding_dim: 480

optimizer:
  class: Adagrad
  lr: 0.05

train:
  loss_function: MarginRankingLoss
  num_epoch: 150
  num_negative: 71
  create_inverse: False

save:
  path: primekg

seed: 42
