# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Table 5. Hyperparameters for DistMult on Hetionet

model:
  name: DistMult
  embedding_dim: 80

optimizer:
  class: Adagrad
  lr: 0.02

train:
  loss_function: MarginRankingLoss
  num_epoch: 400
  num_negative: 41
  create_inverse: False

save:
  path: hetionet

seed: 42
