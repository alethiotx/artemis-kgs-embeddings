# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Table 5. Hyperparameters for TransE on BioKG

model:
  name: TransE
  embedding_dim: 448

optimizer:
  class: Adagrad
  lr: 0.1

train:
  loss_function: MarginRankingLoss
  num_epoch: 600
  num_negative: 91
  create_inverse: False

save:
  path: biokg

seed: 42
