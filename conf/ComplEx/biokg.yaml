# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Table 5. Hyperparameters for ComplEx on BioKG

model:
  name: ComplEx
  embedding_dim: 464

optimizer:
  class: Adagrad
  lr: 0.09

train:
  loss_function: MarginRankingLoss
  num_epoch: 600
  num_negative: 91
  create_inverse: False

save:
  path: biokg

seed: 42
