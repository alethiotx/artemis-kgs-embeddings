# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Adapted from Table 5 ComplEx on BioKG (PrimeKG not in the study)

model:
  name: ComplEx
  embedding_dim: 464

optimizer:
  class: Adagrad
  lr: 0.09

train:
  loss_function: MarginRankingLoss
  num_epoch: 150
  num_negative: 91
  create_inverse: False

save:
  path: primekg

seed: 42
