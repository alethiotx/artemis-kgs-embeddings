# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Table 5. Hyperparameters for ComplEx on Hetionet

model:
  name: ComplEx
  embedding_dim: 272

optimizer:
  class: Adagrad
  lr: 0.03

train:
  loss_function: MarginRankingLoss
  num_epoch: 700
  num_negative: 91
  create_inverse: False

save:
  path: hetionet

seed: 42
