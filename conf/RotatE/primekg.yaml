# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Adapted from Table 5 RotatE on BioKG (PrimeKG not in the study)

model:
  name: RotatE
  embedding_dim: 448

optimizer:
  class: Adagrad
  lr: 0.06

train:
  loss_function: MarginRankingLoss
  num_epoch: 150
  num_negative: 31
  create_inverse: False

save:
  path: primekg

seed: 42
