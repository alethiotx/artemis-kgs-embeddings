# https://www.sciencedirect.com/science/article/pii/S2667318522000071
# Table 5. Hyperparameters for RotatE on BioKG

model:
  name: RotatE
  embedding_dim: 448

optimizer:
  class: Adagrad
  lr: 0.06

train:
  loss_function: MarginRankingLoss
  num_epoch: 900
  num_negative: 31
  create_inverse: False

save:
  path: biokg

seed: 42
